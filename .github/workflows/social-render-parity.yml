name: Social Render Parity Test

# Reparto stagno Social Media Studio (/social).
# Verifica che il video esportato dal VERO player nel cloud (Linux) sia uguale
# a quello dell'anteprima locale. Solo manuale: non pubblica nulla.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Formato da testare'
        required: true
        default: 'P1'
        type: choice
        options: ['P1', 'P2', 'P3', 'DS', 'R1', 'V1', 'V2', 'V3', 'LM1']
      baseline_url:
        description: 'URL MP4 di riferimento (render locale dello STESSO montaggio)'
        required: false
        default: ''
      api_base:
        description: 'API remota per upload video (Supabase signed URL + audio mux)'
        required: true
        default: 'https://www.flowerpowerpizza.com'

jobs:
  parity:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Cache dipendenze NPM
        id: cache-nm
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-nm-v1-${{ hashFiles('package-lock.json') }}

      - name: Install NPM
        if: steps.cache-nm.outputs.cache-hit != 'true'
        run: npm ci --ignore-scripts || npm install --include=dev --ignore-scripts

      - name: Cache binario FFmpeg
        id: cache-ffmpeg
        uses: actions/cache@v4
        with:
          path: ~/.cache/fp-ffmpeg
          key: ubuntu24-ffmpeg-v1

      - name: Prepara e Certifica FFmpeg
        run: |
          mkdir -p "$HOME/.cache/fp-ffmpeg"
          if [ ! -x "$HOME/.cache/fp-ffmpeg/ffmpeg" ]; then
            node node_modules/ffmpeg-static/install.js || true
            if [ -x "node_modules/ffmpeg-static/ffmpeg" ]; then
              cp node_modules/ffmpeg-static/ffmpeg "$HOME/.cache/fp-ffmpeg/ffmpeg"
              chmod +x "$HOME/.cache/fp-ffmpeg/ffmpeg"
            fi
          fi
          if [ ! -x "$HOME/.cache/fp-ffmpeg/ffmpeg" ]; then
            timeout 90 sudo apt-get update -qq -o Acquire::Retries=2 -o Acquire::http::Timeout="15"
            timeout 90 sudo apt-get install -y -qq --fix-missing --no-install-recommends ffmpeg
            cp /usr/bin/ffmpeg "$HOME/.cache/fp-ffmpeg/ffmpeg"
            chmod +x "$HOME/.cache/fp-ffmpeg/ffmpeg"
          fi
          "$HOME/.cache/fp-ffmpeg/ffmpeg" -version | head -n 1
          timeout 15 "$HOME/.cache/fp-ffmpeg/ffmpeg" -nostdin -y -v error -f lavfi -i color=c=black:s=160x90:d=1 -f lavfi -i sine=frequency=440:duration=0.5 -f lavfi -i sine=frequency=880:duration=0.3 -filter_complex "[1:a]volume=1.0,apad=whole_dur=1.5,atrim=0:1.000[bg];[2:a]adelay=500|500,volume=1.8,atrim=0:1.000[sfx];[bg][sfx]amix=inputs=2:duration=first:dropout_transition=2,atrim=0:1.000[a]" -map 0:v -map "[a]" -c:v libx264 -c:a aac -t 1.000 -f null -
          echo "FFMPEG_PATH=$HOME/.cache/fp-ffmpeg/ffmpeg" >> "$GITHUB_ENV"

      - name: Cache Font Thai e Liberation
        id: cache-fonts
        uses: actions/cache@v4
        with:
          path: ~/.local/share/fonts
          key: ubuntu24-thai-fonts-v1

      - name: Font (Thai, Liberation, DejaVu)
        run: |
          mkdir -p "$HOME/.local/share/fonts"
          if [ -z "$(find "$HOME/.local/share/fonts" -maxdepth 3 -type f 2>/dev/null | head -n 1)" ]; then
            (
              timeout 60 sudo apt-get update -qq -o Acquire::Retries=2 -o Acquire::http::Timeout="15" &&
              timeout 60 sudo apt-get install -y -qq --no-install-recommends fonts-liberation fonts-thai-tlwg fonts-dejavu-core &&
              cp -rn /usr/share/fonts/truetype/tlwg /usr/share/fonts/truetype/liberation /usr/share/fonts/truetype/dejavu "$HOME/.local/share/fonts/" 2>/dev/null
            ) || true
          fi
          fc-cache -f "$HOME/.local/share/fonts" 2>/dev/null || true

      - name: Cache Chromium headless (Playwright)
        id: cache-pw
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ubuntu24-pw-v1-${{ hashFiles('package-lock.json') }}

      - name: Install Chromium (Playwright)
        run: |
          if [ "${{ steps.cache-pw.outputs.cache-hit }}" != "true" ]; then
            npx playwright install chromium
          fi
          node -e "import('playwright').then(async p => { const b = await p.chromium.launch({headless:true,args:['--no-sandbox']}); await b.close(); })" || timeout 120 npx playwright install-deps chromium

      - name: Avvia app (vite) in locale sul runner
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          nohup npx vite --host 127.0.0.1 --port 3000 > vite.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:3000/ > /dev/null && break
            sleep 2
          done
          curl -sf http://127.0.0.1:3000/ > /dev/null || (cat vite.log; exit 1)

      - name: Parity test (render con il vero player)
        env:
          CI: 'true'
          PARITY_TAG: cloud
        run: |
          MODE="${{ inputs.mode }}"
          ARGS="--mode=$MODE --base=http://127.0.0.1:3000 --api=${{ inputs.api_base }}"
          FIXTURE="scripts/parity-fixtures/$MODE.testrun.json"
          if [ -f "$FIXTURE" ]; then ARGS="$ARGS --testRunFile=$FIXTURE"; fi
          if [ -n "${{ inputs.baseline_url }}" ]; then ARGS="$ARGS --compare=${{ inputs.baseline_url }}"; fi
          node scripts/render-parity-test.mjs $ARGS

      - name: Salva risultati (video, frame, report)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parity-${{ inputs.mode }}
          path: scratch/parity/
          retention-days: 7
